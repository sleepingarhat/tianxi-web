# 天喜香港賽馬運行流程（2026-10-13）
## 賽馬
- 收排位／賠率
- 首場前 90 分鐘凍結全日四揀＋第五選
- 逐場收賽果・全日首次核實完場後30分鐘主收料・$10 派彩 CSV
- 只重算對帳，不改凍結
## 同步
- 每日已凍結對帳＋全場收市盤 → 分層覆蓋／市場配對
- 賽前近8仗 running_position → 早中末段歷史參考（非T−90快照）
- 原凍結表 → 馬Elo／綜合Elo／因子總分（未存逐軸拆分不倒填）
- 當場實際running_position → 賽前歷史對照（未存T−90估測）
- 凍結模型版本／實際α → 歷史使用紀錄（缺逐版本訓練閘不倒填）
- 賽馬資料推 tianxi-racing
- 發布後鏡像 tianxi-web
- 賽馬異常 Telegram 告警
## 免費路線
- 香港賽馬免費
- 首200名開閘送52週Pro・達門檻不自動收費
- 付款驗收及用戶批准後才開閘・iOS尚未推出
## 封存
- 足球六合彩不再執行・歷史資料保留
